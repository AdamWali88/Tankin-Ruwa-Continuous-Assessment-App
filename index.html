let db=load(); let currentPage='dashboard'; let currentUser=null;
function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return {...defaults}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db)); syncAuthStorage();}
function syncAuthStorage(){localStorage.setItem(KEY+'_auth',JSON.stringify({username:db.username,password:db.password}));}
function normalizeDb(){db.classes=Array.isArray(db.classes)?db.classes:[];db.accounts=Array.isArray(db.accounts)?db.accounts:[];db.currentClassId=db.currentClassId||'';db.finalScores=db.finalScores&&typeof db.finalScores==='object'?db.finalScores:{};db.students=(db.students||[]).map(s=>({...s,classId:s.classId||''}));/* Fixed school scoring scheme: CA /30 + exam /70. */db.caMaxMark=30;db.examMaxMark=70;Object.keys(db.finalScores).forEach(k=>{const v=Number(db.finalScores[k]);if(Number.isFinite(v))db.finalScores[k]=Math.max(0,Math.min(70,v));});const auth=(()=>{try{return JSON.parse(localStorage.getItem(KEY+'_auth')||'null')}catch(e){return null}})();if(auth&&typeof auth.username==='string'&&auth.username.trim()){db.username=auth.username.trim();if(typeof auth.password==='string'&&auth.password)db.password=auth.password;}syncAuthStorage();}
function classLabel(c){return c?`${c.name}${c.section?` ${c.section}`:''}`:''}
function currentClass(){return db.classes.find(c=>c.id===db.currentClassId)||null}
function classStudents(){const c=currentClass();return c?db.students.filter(s=>s.classId===c.id):[]}
function legacyStudents(){return db.students.filter(s=>!s.classId)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function schoolInitials(){const words=String(db.school||"School").trim().split(/\s+/).filter(Boolean);return (words.slice(0,2).map(w=>w.replace(/[^a-z0-9]/ig,"")[0]||"").join("")||"SC").toUpperCase()}

function applySchoolTheme(){setThemeColors(['#1e3a8a','#4f46e5','#0f766e','#f59e0b'])}
function colorDistance(a,b){const x=a.match(/[a-f0-9]{2}/ig).map(v=>parseInt(v,16)),y=b.match(/[a-f0-9]{2}/ig).map(v=>parseInt(v,16));return Math.sqrt(x.reduce((n,v,i)=>n+(v-y[i])**2,0))}
function ensureDarkColor(hex){const rgb=hex.match(/[a-f0-9]{2}/ig).map(v=>parseInt(v,16));const lum=(.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2])/255;if(lum>.48)return '#'+rgb.map(v=>Math.round(v*.62).toString(16).padStart(2,'0')).join('');return hex}

function setThemeColors(colors){const root=document.documentElement;root.style.setProperty('--navy',colors[0]);root.style.setProperty('--blue',colors[1]);root.style.setProperty('--teal',colors[2]);root.style.setProperty('--gold',colors[3]);root.style.setProperty('--shadow',`0 10px 30px ${colors[0]}22`);const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=colors[0];const login=document.querySelector('.login');if(login)login.style.background=`radial-gradient(circle at 20% 20%,rgba(255,255,255,.18),transparent 25%),linear-gradient(135deg,${colors[0]},${colors[1]} 58%,${colors[2]})`;const sidebar=document.querySelector('.sidebar');if(sidebar)sidebar.style.background=colors[0];const hero=document.querySelector('.hero');if(hero)hero.style.background=`linear-gradient(110deg,${colors[0]},${colors[1]})`;const toastEl=document.querySelector('.toast');if(toastEl)toastEl.style.background=colors[0];document.querySelectorAll('.primary,.tab.active').forEach(el=>{el.style.background=colors[0];el.style.color='#fff'});document.querySelectorAll('.secondary,.mobile-menu,.back-btn').forEach(el=>{el.style.background=colors[1]+'18';el.style.color=colors[0]});document.querySelectorAll('.module').forEach(el=>{el.style.borderColor=colors[1]+'45'});document.querySelectorAll('.module .icon').forEach(el=>{el.style.color=colors[1]});document.querySelectorAll('.stat .num,.section-title h3,.topbar h1,.brand-strip .school-name,.login-title').forEach(el=>{el.style.color=colors[0]});document.querySelectorAll('.csv-panel').forEach(el=>{el.style.borderColor=colors[1]+'55';el.style.background=colors[1]+'0d'})}

function init(){
 normalizeDb();applySchoolTheme();
 document.getElementById('loginLogo').src=logoSrc();document.getElementById('loginSchool').textContent=db.school;document.getElementById('username').value=db.username;
 document.getElementById('sideSchool').textContent=db.school;document.getElementById('sideLogo').src=logoSrc();
 // Always require a fresh login whenever the app is launched.
 document.getElementById('loginView').classList.remove('hidden');
 document.getElementById('appView').classList.add('hidden');
}
async function hashTeacherPassword(password){
 try{if(window.crypto&&crypto.subtle){const bytes=new TextEncoder().encode('MARAL-CA-LOCAL-v1:'+password);const digest=await crypto.subtle.digest('SHA-256',bytes);return 'sha256:'+Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('')}}catch(e){}
 // Compatibility fallback for older browsers; local accounts remain a basic access barrier only.
 return 'fallback:'+btoa(unescape(encodeURIComponent(password)));
}
function canManageAccounts(){return ['admin','principal','exams_officer'].includes(currentUser?.role)}
function roleLabel(role){return role==='admin'?'Administrator':role==='principal'?'Principal':role==='exams_officer'?'Examinations Officer':'Teacher'}
function accountExpired(a){return !!(a&&a.expiryDate&&new Date(a.expiryDate+'T23:59:59')<new Date())}
async function login(){
 const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;
 if(u===db.username&&p===db.password){currentUser={username:db.username,displayName:'Administrator',role:'admin'};localStorage.setItem(KEY+'_logged','1');document.getElementById('loginError').classList.add('hidden');openApp();return}
 document.getElementById('loginError').textContent='Incorrect username or password. Use the local administrator login.';document.getElementById('loginError').classList.remove('hidden');
}
function openApp(){document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('currentUserLabel').textContent=currentUser?.displayName||'Administrator';document.getElementById('currentUserMode').textContent='• Offline Mode';const settingsNav=document.querySelector('[data-page="settings"]');if(settingsNav)settingsNav.style.display=currentUser?.role==='admin'?'flex':'none';showPage('dashboard')}
function logout(){localStorage.removeItem(KEY+'_logged');location.reload()}
function toggleSide(){document.getElementById('sidebar').classList.toggle('open')}
function showPage(page){
 if(page==='settings'&&currentUser?.role!=='admin'){toast('Only the Administrator can open App / Admin Settings.');page='dashboard'} if(page==='signup'){page='dashboard'}
 currentPage=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 const titles={dashboard:'Dashboard',students:'Students',assessment:'Assessment',questions:'Question Bank',terminal:'Final Examination',settings:'App / Admin Settings'};
 document.getElementById('pageTitle').textContent=titles[page]||'Dashboard';render();
 document.getElementById('sidebar').classList.remove('open');
}
function render(){
 const m=document.getElementById('main');
 if(currentPage==='dashboard')m.innerHTML=dashboard();
 if(currentPage==='students')m.innerHTML=studentsPage();
 if(currentPage==='assessment')m.innerHTML=assessmentPage();
 if(currentPage==='questions')m.innerHTML=questionsPage();
 if(currentPage==='terminal')m.innerHTML=terminalPage();
 if(currentPage==='settings')m.innerHTML=settingsPage();

}
function dashboard(){
 const boys=db.students.filter(s=>s.gender==='Male').length,girls=db.students.length-boys;
 return `<div class="dashboard-home"><div class="brand-strip"><img src="${logoSrc()}" alt="School logo"><div><div class="school-name">${esc(db.school)}</div><div class="app-name">${esc(db.title)}</div></div></div>
 <section class="home-welcome"><div><h2>Welcome${db.facilitator?', '+esc(db.facilitator):''}!</h2><p>Academic records workspace • ${esc(db.session||'Session not set')}</p></div><div class="home-badge">● Offline Ready</div></section>
 <div class="grid"><div class="card stat"><div class="label">Total Students</div><div class="num">${db.students.length}</div></div><div class="card stat"><div class="label">Male</div><div class="num">${boys}</div></div><div class="card stat"><div class="label">Female</div><div class="num">${girls}</div></div><div class="card stat"><div class="label">Assessments</div><div class="num">${db.assessments.length}</div></div></div>
 <div class="section-title"><h3>Open a Section</h3></div><div class="module-grid">
 ${module('👨‍🎓','Students','Manage and alphabetically save your class register.','students')}
 ${module('📝','Assessment','Enter CA scores, calculate totals and grades, save and print results.','assessment')}

function sameKey(a,b){return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase()}
function finalScoreKey(className,subject,session,term,studentId){return [className,subject,session,term,studentId].map(v=>String(v??'').trim().toLowerCase()).join('::')}
function cumulativeCA(subject,className){
  const selected=db.assessments.filter(a=>
    (!subject || sameKey(a.subject,subject)) &&
    (!className || sameKey(a.className,className))
  );
  const totals={};
  db.students.forEach(s=>{
    let earned=0,max=0;
    selected.forEach(a=>{earned+=Number(a.scores?.[s.id]||0);max+=Number(a.maxMark||0)});
    const caMax=Math.max(1,Number(db.caMaxMark)||30);totals[s.id]={earned,max,ca40:max?Math.min(caMax,(earned/max)*caMax):0};
  });
  return {selected,totals};
}
function normalizeAssessmentQuestionSet(a){
  if(!a.questions || !a.questions.length) return;
  const exists=db.questionSets.some(q=>q.sourceAssessmentId===a.id);
  if(!exists){
    db.questionSets.push({
      id:'qs_'+a.id,
      sourceAssessmentId:a.id,
      source:'Assessment',
      date:a.date,
      subject:a.subject,
      className:a.className,
      questions:a.questions
    });
  }
}

function csvCell(value){const v=String(value??'');return '"'+v.replace(/"/g,'""')+'"'}
function downloadCsvFile(rows,filename){const csv='\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function safeFilePart(value){return String(value||'').trim().replace(/[^a-z0-9_-]+/gi,'_').replace(/^_+|_+$/g,'')||'Class'}

function grade(n){n=Number(n)||0;return n>=70?'A':n>=60?'B':n>=50?'C':n>=45?'D':n>=40?'E':'F'}
function showScoreEditor(a,editingIndex=null){
 sortStudents();
 /* Editing always uses the class saved with the assessment. The score field itself is the saved value. */
 const students=editingIndex!==null && a.classId ? db.students.filter(st=>st.classId===a.classId).sort((x,y)=>x.name.localeCompare(y.name)) : classStudents();
 const isEditing=editingIndex!==null;
 const savedScores=(a&&a.scores&&typeof a.scores==='object')?a.scores:{};
 /* Build fallbacks by student name as well as ID. This keeps old saved records editable even if a student ID was normalized. */
 const scoreByName={};
 Object.keys(savedScores).forEach(k=>{ const st=db.students.find(s=>String(s.id)===String(k)); if(st) scoreByName[String(st.name).trim().toLowerCase()]=savedScores[k]; });
 const rows=students.map((st,i)=>{
   let raw;
   if(Object.prototype.hasOwnProperty.call(savedScores,st.id)) raw=savedScores[st.id];
   else if(Object.prototype.hasOwnProperty.call(savedScores,String(st.id))) raw=savedScores[String(st.id)];
   else raw=scoreByName[String(st.name).trim().toLowerCase()];
   const hasPrevious=raw!==undefined && raw!==null && raw!=='' && !Number.isNaN(Number(raw));
   const shown=hasPrevious?String(Number(raw)):'';
   return `<tr><td>${i+1}</td><td><span class="student-name">${esc(st.name)}</span></td><td><input class="score edit-score-box" data-id="${esc(st.id)}" type="number" min="0" max="${a.maxMark}" value="${esc(shown)}" placeholder="" inputmode="decimal" autocomplete="off" aria-label="Score for ${esc(st.name)}"></td><td class="live-percent" data-for="${esc(st.id)}">${shown===''?'—':((Number(shown)/a.maxMark)*100).toFixed(1)}</td></tr>`;
 }).join('');

 const rows=db.accounts.map((a,i)=>{const canManage=isAdmin||a.role==='teacher';const expired=accountExpired(a),active=a.active!==false&&!expired;const status=expired?'Expired':active?'Active':'Inactive';const actions=canManage?`<button class="secondary small" onclick="toggleTeacherAccount('${esc(a.id)}')">${active?'Deactivate':'Activate'}</button> <button class="danger small" onclick="deleteTeacherAccount('${esc(a.id)}')">Delete</button>`:'<span class="small" style="color:var(--muted)">Managed by Administrator</span>';return `<tr><td>${i+1}</td><td><b>${esc(a.displayName||a.username)}</b></td><td>${esc(a.username)}</td><td>${esc(roleLabel(a.role||'teacher'))}</td><td><span class="status-pill">${status}</span></td><td>${esc(a.expiryDate||'No expiry')}</td><td>${actions}</td></tr>`;}).join('');
 return `<div class="card" style="border-top:5px solid var(--blue);margin-bottom:16px"><h2 style="margin:0 0 7px;color:var(--navy)">👥 User Access Management</h2><p style="color:var(--muted);font-size:13px;line-height:1.6;margin:0">There is no public teacher registration. Only the Administrator, Principal, or Examinations Officer can manage access. The Principal and Examinations Officer can create, deactivate, reactivate, and delete teacher accounts.</p></div>
 <div class="card" style="margin-bottom:16px"><h3 style="margin-top:0;color:var(--navy)">Create an Account</h3><div class="row"><div class="field"><label>Full name</label><input id="teacherDisplayName" placeholder="e.g. Amina Musa" autocomplete="name"></div><div class="field"><label>Username</label><input id="teacherUsername" placeholder="e.g. amina.musa" autocomplete="off"></div><div class="field"><label>Account role</label><select id="teacherRole"><option value="teacher">Teacher</option>${isAdmin?'<option value="principal">Principal</option><option value="exams_officer">Examinations Officer</option>':''}</select></div><div class="field"><label>Password (at least 6 characters)</label><input id="teacherPassword" type="password" autocomplete="new-password" placeholder="Create a strong password"></div><div class="field"><label>Optional expiry date</label><input id="teacherExpiry" type="date"></div></div><button class="primary" onclick="createTeacherAccount()">＋ Create Account</button><div class="notice" style="margin-top:12px">Give login details privately. Accounts are stored in this browser and do not automatically transfer to another device. Expiry dates are checked when a user logs in.</div></div>
 <div class="card"><h3 style="margin-top:0;color:var(--navy)">Registered Accounts</h3><div class="table-wrap"><table class="table"><thead><tr><th>S/N</th><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Expiry</th><th>Actions</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">No accounts have been created yet.</td></tr>'}</tbody></table></div><div class="notice" style="margin-top:12px">Offline limitation: account changes apply only to this browser/device. They cannot remotely revoke access on another device or to a separately copied app. Export backups regularly.</div></div>`;
}

function deleteClassProfile(id){
 const c=db.classes.find(x=>String(x.id)===String(id));if(!c)return toast('Class profile not found.');
 const label=classLabel(c);const n=db.students.filter(x=>String(x.classId)===String(id)).length;const a=db.assessments.filter(x=>String(x.classId)===String(id)||sameKey(x.className,label)).length;
 if(!confirm(`Delete class profile "${label}"? This will also delete its ${n} student record(s), ${a} assessment(s), related question sets, examination records and saved final scores. Export a backup first if you need to keep these records.`))return;
 const studentIds=new Set(db.students.filter(x=>String(x.classId)===String(id)).map(x=>String(x.id)));
 db.students=db.students.filter(x=>String(x.classId)!==String(id));
 db.assessments=db.assessments.filter(x=>String(x.classId)!==String(id)&&!sameKey(x.className,label));
 db.questionSets=(db.questionSets||[]).filter(x=>String(x.classId||'')!==String(id)&&!sameKey(x.className,label));
 db.exams=(db.exams||[]).filter(x=>String(x.classId||'')!==String(id)&&!sameKey(x.className,label));
 Object.keys(db.finalScores||{}).forEach(k=>{if(k.toLowerCase().startsWith(label.toLowerCase()+'::')||[...studentIds].some(sid=>k.toLowerCase().endsWith('::'+sid.toLowerCase())))delete db.finalScores[k];});
 db.classes=db.classes.filter(x=>String(x.id)!==String(id));if(String(db.currentClassId)===String(id))db.currentClassId=db.classes[0]?.id||'';
 save();render();toast('Class profile and its linked records deleted.');
}
function settingsPage(){
 const classRows=db.classes.map((c,i)=>`<tr><td>${i+1}</td><td><b>${esc(classLabel(c))}</b></td><td>${esc(c.session||'')}</td><td>${esc(c.term||'')}</td><td>${c.id===db.currentClassId?'Current':'—'}</td><td><button class="danger small" onclick="deleteClassProfile('${c.id}')">Delete Class</button></td></tr>`).join('');
 return `<div class="card" style="margin-bottom:15px"><div class="section-title"><h3 style="margin:0;color:var(--navy)">Class Profiles</h3><button class="primary" onclick="openClassModal()">+ Add Class</button></div><div class="notice">Create a separate class profile for every class you teach. Student names, assessments and results are kept separate by class.</div><div class="table-wrap"><table class="table"><thead><tr><th>S/N</th><th>Class</th><th>Session</th><th>Term</th><th>Status</th><th>Manage</th></tr></thead><tbody>${classRows||`<tr><td colspan="6" class="empty">No class profiles created yet.</td></tr>`}</tbody></table></div></div><div class="kpi-grid"><div class="card"><div style="margin-bottom:12px"><button class="back-btn" onclick="showPage('dashboard')">← Return</button></div><h3 style="margin-top:0;color:var(--navy)">School & Display</h3><div class="field"><label>School Name</label><input id="setSchool" value="${esc(db.school)}"></div><div class="field"><label>App Title</label><input id="setTitle" value="${esc(db.title)}"></div><div class="field"><label>Facilitator / Teacher</label><input id="setFac" value="${esc(db.facilitator)}"></div><div class="field"><label>Session</label><input id="setSession" value="${esc(db.session)}" placeholder="e.g. 2026/2027"></div><div class="field"><label>Term</label><input id="setTerm" value="${esc(db.term)}" placeholder="e.g. First Term"></div><div class="row"><div class="field"><label>Continuous Assessment Maximum</label><input value="30 marks" readonly></div><div class="field"><label>Terminal Examination Maximum</label><input value="70 marks" readonly></div></div><div class="notice">The school scoring scheme is fixed at CA /30 + Examination /70 = Total /100. Manual score entry is limited to the relevant maximum.</div><button class="primary" onclick="saveSettings()">Save Display Settings</button></div>
 <div class="card"><h3 style="margin-top:0;color:var(--navy)">School Logo</h3><img src="${logoSrc()}" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:4px solid #edf2f6"><p class="small" style="color:var(--muted)">The Umar Idris initials emblem is built into this app and works offline. Teachers do not need to upload a logo. When the official school crest is provided, it can replace this built-in emblem in a later build.</p></div>
 <div class="card"><h3 style="margin-top:0;color:var(--navy)">Admin Security</h3><div class="field"><label>Username</label><input id="setUser" value="${esc(db.username)}"></div><div class="field"><label>New Password</label><input id="setPass" type="password" placeholder="Leave unchanged if blank"></div><button class="primary" onclick="saveSecurity()">Update Login</button><div class="notice" style="margin-top:12px">Change the default administrator login before use. The offline app provides a local access barrier, not server-side security. Export regular backups.</div></div>
 <div class="card"><h3 style="margin-top:0;color:var(--navy)">Data Management</h3><button class="secondary" onclick="exportData()">Export Backup</button> <button class="secondary" onclick="document.getElementById('importFile').click()">Import Backup</button><input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)"><button class="danger" onclick="resetData()">Reset All Local Data</button><p class="small" style="color:var(--muted);margin-top:12px">Keep backups because offline data is stored only on this device/browser.</p></div></div>`;
}
function saveSettings(){db.school=document.getElementById('setSchool').value.trim()||defaults.school;db.title=document.getElementById('setTitle').value.trim()||defaults.title;db.facilitator=document.getElementById('setFac').value.trim();db.session=document.getElementById('setSession').value.trim();db.term=document.getElementById('setTerm').value.trim();db.caMaxMark=30;db.examMaxMark=70;save();applySchoolTheme();document.getElementById('loginSchool').textContent=db.school;document.getElementById('sideSchool').textContent=db.school;document.getElementById('sideLogo').src=logoSrc();document.getElementById('loginLogo').src=logoSrc();toast('Display settings and score limits saved.');render()}
function saveLogo(){const f=document.getElementById('logoFile').files[0];if(!f)return toast('Choose a logo first.');const r=new FileReader();r.onload=()=>{db.logo=r.result;save();applySchoolTheme();document.getElementById('loginLogo').src=logoSrc();document.getElementById('sideLogo').src=logoSrc();toast('Logo saved offline. School colours updated from the logo.');render()};r.readAsDataURL(f)}
function saveSecurity(){if(currentUser?.role!=='admin')return toast('Administrator access required.');const u=document.getElementById('setUser').value.trim(),p=document.getElementById('setPass').value;if(!u)return toast('Username cannot be empty.');if(p&&p.length<6)return toast('Use a password with at least 6 characters.');if(db.accounts.some(a=>String(a.username).toLowerCase()===u.toLowerCase()))return toast('That username is already used by a teacher account.');if(!p&&u===db.username)return toast('No login change was made.');db.username=u;if(p)db.password=p;const auth={username:db.username,password:db.password};localStorage.setItem(KEY+'_auth',JSON.stringify(auth));localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('setPass').value='';document.getElementById('username').value=db.username;document.getElementById('password').value='';toast('Administrator login details saved. Log out and sign in again with the new credentials.')}
async function createTeacherAccount(){if(!canManageAccounts())return toast('Authorised management access required.');const name=document.getElementById('teacherDisplayName').value.trim(),u=document.getElementById('teacherUsername').value.trim(),p=document.getElementById('teacherPassword').value,role=document.getElementById('teacherRole').value,expiryDate=document.getElementById('teacherExpiry').value;if(!name||!u||!p)return toast('Enter the full name, username and password.');if(role!=='teacher'&&currentUser.role!=='admin')return toast('Only the Administrator can create management accounts.');if(u.toLowerCase()===db.username.toLowerCase()||db.accounts.some(a=>String(a.username).toLowerCase()===u.toLowerCase()))return toast('That username already exists. Choose another.');if(p.length<6)return toast('Password must be at least 6 characters.');if(expiryDate&&new Date(expiryDate+'T23:59:59')<new Date())return toast('Expiry date must be today or a future date.');const passwordHash=await hashTeacherPassword(p);db.accounts.push({id:'account_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),username:u,displayName:name,passwordHash,role,active:true,expiryDate:expiryDate||'',createdAt:new Date().toISOString()});save();render();toast(role==='teacher'?'Teacher account created. Give the login details privately.':roleLabel(role)+' account created.');}
function toggleTeacherAccount(id){if(!canManageAccounts())return toast('Authorised management access required.');const a=db.accounts.find(x=>x.id===id);if(!a)return;if(currentUser.role!=='admin'&&a.role!=='teacher')return toast('The Principal and Examinations Officer may only change teacher access.');a.active=a.active===false?true:false;save();render();toast((a.active?'Activated ':'Deactivated ')+(a.displayName||a.username)+'.');}
function deleteTeacherAccount(id){if(!canManageAccounts())return toast('Authorised management access required.');const a=db.accounts.find(x=>x.id===id);if(!a)return;if(currentUser.role!=='admin'&&a.role!=='teacher')return toast('The Principal and Examinations Officer may only remove teacher accounts.');if(!confirm('Delete the account for '+(a.displayName||a.username)+'? This does not delete students or scores.'))return;db.accounts=db.accounts.filter(x=>x.id!==id);save();render();toast('Account deleted.');}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='CA_Record_Backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported.')}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);db={...defaults,...x};save();location.reload()}catch(err){toast('Invalid backup file.')}};r.readAsText(f)}
function resetData(){if(confirm('This will delete all students, assessments, questions and settings stored on this device. Continue?')){localStorage.removeItem(KEY);localStorage.removeItem(KEY+'_logged');localStorage.removeItem(KEY+'_auth');location.reload()}}
function printStudents(){sortStudents();document.getElementById('main').innerHTML=`<div class="card"><div class="print-head" style="display:block"><div class="school-print">${esc(db.school)}</div><div class="title-print">Student Register</div></div><div class="actions no-print" style="margin-bottom:15px"><button class="secondary" onclick="showPage('students')">Back</button><button class="primary" onclick="window.print()">Print / Save PDF</button></div><table class="table"><thead><tr><th>S/N</th><th>Student Name</th><th>Gender</th><th>Admission No.</th></tr></thead><tbody>${db.students.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.name)}</td><td>${esc(s.gender||'')}</td><td>${esc(s.admission||'')}</td></tr>`).join('')}</tbody></table></div>`}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=37').catch(()=>{}));}
init();
</script>
</body>
</html>
